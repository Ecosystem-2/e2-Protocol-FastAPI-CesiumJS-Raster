<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Climate Index Ingest - Upload GeoTIFF</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      background-image: 
        radial-gradient(at 47% 33%, hsl(240, 70%, 30%) 0px, transparent 50%),
        radial-gradient(at 82% 65%, hsl(268, 80%, 25%) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #667eea 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 32px;
      font-weight: 700;
    }
    .subtitle {
      color: #9ca3af;
      margin: 0 0 30px 0;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #e5e7eb;
      font-weight: 500;
      font-size: 14px;
    }
    label .required {
      color: #f87171;
    }
    input[type="text"],
    input[type="datetime-local"],
    select {
      width: 100%;
      padding: 12px;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #e5e7eb;
      transition: all 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(31, 41, 55, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    select {
      cursor: pointer;
    }
    option {
      background: #1f2937;
      color: #e5e7eb;
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }
    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 2px dashed rgba(139, 92, 246, 0.5);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(31, 41, 55, 0.4);
    }
    .file-input-label:hover {
      background: rgba(31, 41, 55, 0.6);
      border-color: #8b5cf6;
      transform: translateY(-2px);
    }
    .file-input-label.has-file {
      border-style: solid;
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
    }
    .file-icon {
      font-size: 28px;
      margin-right: 12px;
    }
    .file-text {
      color: #a78bfa;
      font-weight: 500;
    }
    .file-input-label.has-file .file-text {
      color: #10b981;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
    }
    button:active:not(:disabled) {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      backdrop-filter: blur(10px);
    }
    .status.info {
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .result {
      margin-top: 20px;
      padding: 20px;
      background: rgba(31, 41, 55, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      display: none;
      backdrop-filter: blur(10px);
    }
    .result h3 {
      margin: 0 0 15px 0;
      color: #a78bfa;
      font-size: 16px;
      font-weight: 600;
    }
    .result pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
      color: #d1d5db;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
      line-height: 1.6;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Climate Index Ingest</h1>
    <p class="subtitle">Upload GeoTIFF files to the climate indices database</p>
    
    <form id="uploadForm">
      <div class="form-group">
        <label>
          GeoTIFF File <span class="required">*</span>
        </label>
        <div class="file-input-wrapper">
          <input type="file" id="fileInput" accept=".tif,.tiff" required />
          <label for="fileInput" class="file-input-label" id="fileLabel">
            <span class="file-icon">📁</span>
            <span class="file-text">Click to select .tif file</span>
          </label>
        </div>
      </div>
      
      <div class="form-group">
        <label for="indexType">
          Index Type <span class="required">*</span>
        </label>
        <select id="indexType" required>
          <option value="">Select index type...</option>
          <option value="humid-heat-stress">Humid Heat Stress (WBGT)</option>
          <option value="ppet">P-PET Ratio</option>
          <option value="temperature">Temperature</option>
          <option value="precipitation">Precipitation</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="timeStart">
          Time Start <span class="required">*</span>
        </label>
        <input type="datetime-local" id="timeStart" required />
        <div class="hint">Start date of the time range covered by this dataset</div>
      </div>
      
      <div class="form-group">
        <label for="timeEnd">
          Time End <span class="required">*</span>
        </label>
        <input type="datetime-local" id="timeEnd" required />
        <div class="hint">End date of the time range covered by this dataset</div>
      </div>
      
      <div class="form-group">
        <label for="units">
          Units
        </label>
        <input type="text" id="units" placeholder="e.g., °C, mm, ratio" />
        <div class="hint">Optional: measurement units for the index values</div>
      </div>
      
      <button type="submit" id="submitBtn">
        Upload & Store
      </button>
    </form>
    
    <div id="status" class="status"></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8080/api/climate-indices";
    
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    
    // Update file label when file is selected
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileLabel.classList.add('has-file');
        fileLabel.querySelector('.file-text').textContent = `✓ ${file.name} (${formatFileSize(file.size)})`;
      } else {
        fileLabel.classList.remove('has-file');
        fileLabel.querySelector('.file-text').textContent = 'Click to select .tif file';
      }
    });
    
    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const file = fileInput.files[0];
      if (!file) {
        showStatus('Please select a GeoTIFF file', 'error');
        return;
      }
      
      // Prepare form data
      const formData = new FormData();
      formData.append('file', file);
      formData.append('index_type', document.getElementById('indexType').value);
      formData.append('time_start', convertToISOString(document.getElementById('timeStart').value));
      formData.append('time_end', convertToISOString(document.getElementById('timeEnd').value));
      formData.append('units', document.getElementById('units').value);
      
      // Disable form during upload
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';
      showStatus('Uploading and processing GeoTIFF...', 'info');
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch(`${API_BASE}/ingest/store`, {
          method: 'POST',
          body: formData
        });
        
        if (!response.ok) {
          const error = await response.json().catch(() => ({ detail: response.statusText }));
          throw new Error(error.detail || `HTTP ${response.status}`);
        }
        
        const data = await response.json();
        showStatus('✓ Upload successful! Asset stored in database.', 'success');
        showResult(data);
        
        // Reset form
        form.reset();
        fileLabel.classList.remove('has-file');
        fileLabel.querySelector('.file-text').textContent = 'Click to select .tif file';
        
      } catch (error) {
        showStatus(`Upload failed: ${error.message}`, 'error');
        console.error('Upload error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload & Store';
      }
    });
    
    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
      statusDiv.style.display = 'block';
    }
    
    function showResult(data) {
      resultDiv.innerHTML = `
        <h3>✨ Asset Created</h3>
        <pre>${JSON.stringify({
          asset_id: data.asset_id,
          filename: data.asset?.filename || 'N/A',
          index_type: data.asset?.index_type || 'N/A',
          time_range: data.asset?.time_range || null,
          units: data.asset?.units || null,
          raster: {
            crs: `EPSG:${data.raster?.epsg || 'unknown'}`,
            bounds: data.raster?.bounds || null,
            resolution: data.raster?.resolution || null,
            dtype: data.raster?.dtype || null,
            nodata: data.raster?.nodata,
            stats: {
              min: data.raster?.min,
              max: data.raster?.max,
              mean: data.raster?.mean,
              std: data.raster?.std
            }
          },
          storage: {
            raw: {
              kind: data.storage?.raw?.kind || 'unknown',
              uri: data.storage?.raw?.uri || 'N/A',
              size: formatFileSize(data.storage?.raw?.size_bytes || 0)
            },
            cog: {
              kind: data.storage?.cog?.kind || 'unknown',
              uri: data.storage?.cog?.uri || 'N/A',
              size: formatFileSize(data.storage?.cog?.size_bytes || 0)
            }
          },
          replaced: data.replaced || false
        }, null, 2)}</pre>
      `;
      resultDiv.style.display = 'block';
    }
    
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
    
    function convertToISOString(datetimeLocal) {
      // Convert datetime-local format to ISO 8601 with .000Z
      if (!datetimeLocal) return '';
      const date = new Date(datetimeLocal);
      return date.toISOString();
    }
    
    // Set default time values (current year range)
    const now = new Date();
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const endOfYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
    
    document.getElementById('timeStart').value = formatDatetimeLocal(startOfYear);
    document.getElementById('timeEnd').value = formatDatetimeLocal(endOfYear);
    
    function formatDatetimeLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }
  </script>
</body>
</html>
