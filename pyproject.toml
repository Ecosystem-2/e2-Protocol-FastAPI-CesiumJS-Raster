[project]
name = "e2-protocol-fastapi-cesiumjs-raster"
version = "0.1.0"
description = "Climate-data microservice: ingests GeoTIFF climate-index rasters and serves them as map tiles, zonal statistics and CZML documents for CesiumJS"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "Pillow>=11.0.0",
    "google-cloud-storage>=2.18.2",
    "motor>=3.7.1",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pymongo>=4.15.3",
    "rioxarray>=0.20.0",
    "scipy>=1.16.3",
    "tqdm>=4.67.1",
    "czml3>=3.0.0",
    "shapely>=2.1.2",
    "rio-tiler>=8.0.1",
    "pydantic>=2.12.4",
    "pytest>=9.1.1",
    "PyJWT[crypto]>=2.8.0",
]

[tool.pytest.ini_options]
# The project is virtual, so `app` is never installed into the venv, and pytest's default
# import mode puts tests/ on sys.path rather than the repository root. Without this, every
# test that imports the application fails on `No module named 'app'` unless you happen to
# invoke it as `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
