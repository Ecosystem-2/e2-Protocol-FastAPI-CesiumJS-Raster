<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Humid Heat Stress - CesiumJS Timeline</title>
    <link rel="stylesheet" href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css">
    <link rel="stylesheet" href="./static/cesium-viewer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
    <div id="toolbar">
        <div class="control">
            <label for="scenarioSelect">Scenario period</label>
            <select id="scenarioSelect"></select>
        </div>
    </div>
    <div id="activePeriod">Loading period...</div>
    <div id="legend">
        <h4>Threat levels</h4>
        <ul id="legendItems"></ul>
    </div>
    <div id="status"></div>
    <div id="cesiumContainer"></div>
    <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff@1.0.0-beta.12/dist-browser/geotiff.min.js"></script>
    <script>
        // Optional: Configure API base URL for different deployment scenarios
        // Uncomment and set one of these if needed:
        
        // Option 1: Explicit API base URL (for cross-origin deployments)
        // window.HUMID_HEAT_STRESS_API_BASE_URL = 'https://api.example.com';
        
        // Option 2: FastAPI base URL (alternative)
        // window.FASTAPI_BASE_URL = 'https://api.example.com';
        
        // Option 3: FastAPI port (for localhost development with different ports)
        // window.FASTAPI_PORT = '8080';
    </script>
    <script src="./static/cesium-geotif-viewer.js"></script>
    <script src="./static/humid-heat-stress-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const config = getHumidHeatStressConfig();
            const viewer = new CesiumGeoTIFFViewer(config);
            viewer.init().catch((error) => {
                viewer.setStatus(`Failed to start: ${error.message}`, true);
            });
        });
    </script>
</body>
</html>
