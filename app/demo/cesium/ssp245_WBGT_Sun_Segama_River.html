<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WBGT Segama River – CZML Viewer</title>
  <link href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
  <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: true,
      animation: true,
      baseLayerPicker: true,
      sceneModePicker: true,
      geocoder: false,
    });

    // Load CZML generated by the converter script (one directory up)
    const czmlUrl = '../ssp245_WBGT_Sun_Segama_River.czml';
    Cesium.CzmlDataSource.load(czmlUrl).then(ds => {
      viewer.dataSources.add(ds);
      return viewer.zoomTo(ds);
    }).catch(err => {
      console.error(err);
      alert('Failed to load CZML. If opening this file directly, run a local server to avoid CORS issues.\nTry: python3 -m http.server from the project root and open this HTML via http://localhost:8000/.');
    });
  </script>
</body>
</html>
