name: Deploy Demo Dockerhub Image

env:
  REPO_STAGE: unstable
  REPO_NAME: demo
  REPO_TYPE: frontend

on:
    push:
        branches:
          - 'unstable'

jobs:
  push_to_registry:
    name: Build and publish
    
    runs-on: ubuntu-latest
    
    steps:
        
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_STAGE }}-${{ env.REPO_NAME }}-${{ env.REPO_TYPE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.REPO_STAGE }}-{{date 'YYYYMMDD-HHmmss'}}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./app/demo/Dockerfile
          push: true
          no-cache: true
          pull: true
          platforms: linux/amd64 #,linux/arm64,linux/arm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # AGPL section 13: /source must name the commit answering requests, not the
          # branch it was cut from.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
