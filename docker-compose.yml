# Docker Compose for HOB FastAPI Climate Tile Server
# Uses external MongoDB Atlas - no local database needed

version: '3.8'

services:
  # ============================================================================
  # FastAPI Application
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hob-fastapi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MongoDB Atlas connection (set in .env file)
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-climate_indices}
      MONGO_ASSETS_COLLECTION: ${MONGO_ASSETS_COLLECTION:-assets}
      
      # GCS configuration (set in .env file)
      GCS_BUCKET: ${GCS_BUCKET}
      GCS_PREFIX: ${GCS_PREFIX:-uploads}
      
      # Credentials path inside container (always absolute)
      GOOGLE_APPLICATION_CREDENTIALS: /app/data/gcs_credentials.json
      
      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Demo frontend configuration
      DEMO_API_BASE: ${DEMO_API_BASE:-http://localhost:8080/api/climate-indices}
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    volumes:
      # Mount GCS credentials (create this file first!)
      - ./data/gcs_credentials.json:/app/data/gcs_credentials.json:ro
      
      # Optional: mount demo files for easy access
      - ./app/demo:/app/app/demo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
