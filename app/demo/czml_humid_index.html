<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Humid Heat Stress CZML Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css">
    <link rel="stylesheet" href="./static/cesium-viewer.css">
</head>
<body>
    <div id="toolbar">
        <div class="control">
            <label for="czmlPreset">Preset dataset</label>
            <select id="czmlPreset">
                <option value="ssp245_WBGT_Sun_Segama_River_interval.czml">Segama Interval Timeline</option>
                <option value="ssp245_WBGT_Sun_Segama_River_timestamp.czml">Segama Timestamp Timeline</option>
            </select>
            <button id="loadPreset">Load</button>
        </div>
        <div class="control">
            <label for="customCzml">Custom CZML URL</label>
            <input type="text" id="customCzml" placeholder="https://example.com/data/file.czml" />
            <button id="loadCustom">Load URL</button>
        </div>
    </div>
    <div id="status">Select a dataset to load.</div>
    <div id="cesiumContainer"></div>

    <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
    <script>
        (function () {
            const DEFAULT_ROOTS = (() => {
                const roots = [];
                if (window.HUMID_HEAT_STRESS_CZML_ROOT) {
                    roots.push(window.HUMID_HEAT_STRESS_CZML_ROOT);
                }
                if (window.location.protocol !== 'file:') {
                    roots.push('/api/demo/humid-heat-stress/assets');
                    roots.push('/data/humid-heat-stress');
                }
                if (window.location.pathname.includes('/app/')) {
                    roots.push('../data/humid-heat-stress');
                }
                roots.push('../../data/humid-heat-stress');
                return [...new Set(roots)];
            })();

            function getTerrainProvider() {
                if (typeof Cesium.createWorldTerrain === 'function') {
                    return Cesium.createWorldTerrain();
                }
                if (Cesium.WorldTerrain && typeof Cesium.WorldTerrain.fromAssetId === 'function') {
                    return Cesium.WorldTerrain.fromAssetId(1);
                }
                return new Cesium.EllipsoidTerrainProvider();
            }

            const viewer = new Cesium.Viewer('cesiumContainer', {
                animation: true,
                timeline: true,
                terrainProvider: getTerrainProvider(),
                sceneModePicker: true,
                selectionIndicator: false,
            });

            const statusEl = document.getElementById('status');
            const presetSelect = document.getElementById('czmlPreset');
            const loadPresetBtn = document.getElementById('loadPreset');
            const customInput = document.getElementById('customCzml');
            const loadCustomBtn = document.getElementById('loadCustom');

            function setStatus(message, isError = false) {
                statusEl.textContent = message;
                statusEl.style.color = isError ? '#d33' : '#fff';
                statusEl.style.background = isError ? '#ffeeee' : 'transparent';
            }

            async function tryLoadCzml(urls) {
                let lastError = null;
                for (const url of urls) {
                    try {
                        const ds = await Cesium.CzmlDataSource.load(url);
                        return { ds, url };
                    } catch (err) {
                        lastError = err;
                        console.warn(`Failed to load ${url}:`, err);
                    }
                }
                throw lastError || new Error('Unable to load CZML');
            }

            async function loadFromRoots(filename) {
                const urls = DEFAULT_ROOTS.map((root) => {
                    const cleanedRoot = root.replace(/\/$/, '');
                    return `${cleanedRoot}/${filename}`;
                });
                return tryLoadCzml(urls);
            }

            function applyClock(ds) {
                if (!ds.clock) {
                    viewer.clock.shouldAnimate = true;
                    return;
                }
                const { startTime, stopTime, currentTime, clockRange, clockStep, multiplier } = ds.clock;
                viewer.clock.startTime = startTime.clone();
                viewer.clock.stopTime = stopTime.clone();
                viewer.clock.currentTime = currentTime.clone();
                viewer.clock.clockRange = clockRange;
                viewer.clock.clockStep = clockStep;
                viewer.clock.multiplier = multiplier;
                viewer.timeline.zoomTo(startTime, stopTime);
                viewer.clock.shouldAnimate = true;
            }

            async function loadPreset() {
                const filename = presetSelect.value;
                setStatus(`Loading ${filename}...`);
                try {
                    const { ds, url } = await loadFromRoots(filename);
                    viewer.dataSources.removeAll();
                    await viewer.dataSources.add(ds);
                    await viewer.zoomTo(ds);
                    applyClock(ds);
                    setStatus(`Loaded ${filename} from ${url}`);
                } catch (err) {
                    setStatus(`Failed to load preset: ${err.message}`, true);
                }
            }

            async function loadCustom() {
                const url = customInput.value.trim();
                if (!url) {
                    setStatus('Enter a CZML URL to load.', true);
                    return;
                }
                setStatus(`Loading ${url}...`);
                try {
                    const { ds } = await tryLoadCzml([url]);
                    viewer.dataSources.removeAll();
                    await viewer.dataSources.add(ds);
                    await viewer.zoomTo(ds);
                    applyClock(ds);
                    setStatus(`Loaded CZML from ${url}`);
                } catch (err) {
                    setStatus(`Failed to load custom CZML: ${err.message}`, true);
                }
            }

            loadPresetBtn.addEventListener('click', loadPreset);
            loadCustomBtn.addEventListener('click', loadCustom);

            // Attempt to auto-load the first preset for convenience
            loadPreset();
        })();
    </script>
</body>
</html>
