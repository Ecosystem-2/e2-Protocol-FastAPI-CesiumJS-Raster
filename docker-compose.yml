# Docker Compose for e2 Protocol: FastAPI + CesiumJS (Raster), the climate tile server
# Uses external MongoDB Atlas - no local database needed

version: '3.8'

services:
  # ============================================================================
  # FastAPI Application
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visengine-microservice
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MongoDB Atlas connection (set in .env file)
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB:-climate_indices}
      MONGO_ASSETS_COLLECTION: ${MONGO_ASSETS_COLLECTION:-assets}
      
      # GCS configuration (set in .env file)
      GCS_BUCKET: ${GCS_BUCKET}
      GCS_PREFIX: ${GCS_PREFIX:-uploads}
      
      # Credentials path inside container (always absolute)
      GOOGLE_APPLICATION_CREDENTIALS: /app/data/gcs_credentials.json
      
      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      VSI_CACHE: "FALSE"
      GDAL_VERIFY_AFTER_UPLOAD: "true"
      GDAL_TILE_DIAGNOSTICS: "true"
      
      # Demo frontend configuration
      DEMO_API_BASE: ${DEMO_API_BASE:-http://localhost:8080/api/climate-indices}
      CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}

      # Source offer (AGPL section 13). This block is an allow-list, so anything not named
      # here never reaches the container: without SOURCE_URL, /source cannot tell a user
      # where the running code came from and the deployment does not meet section 13.
      #
      # SOURCE_REVISION is deliberately absent. The Dockerfile bakes it in at build time,
      # and naming it here would set it to the empty string whenever the host has not
      # exported one, overwriting the commit the image already knows.
      SOURCE_URL: ${SOURCE_URL:-}
    volumes:
      # Mount GCS credentials (create this file first!)
      - ./data/gcs_credentials.json:/app/data/gcs_credentials.json:ro
      
      # Optional: mount demo files for easy access
      - ./app/demo:/app/app/demo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
